# Minute-level pinger for the real-time push scheduler.
#
#     THIS COPY IS THE TEMPLATE; the live workflow is
#     .github/workflows/push-scheduler.yml (already committed). The loop
#     itself lives in .github/actions/ping-loop/action.yml — the workflow
#     files only declare the trigger and call that action. A second,
#     identical live workflow (push-scheduler-backup.yml) runs the same
#     action on its own minute cron; both share the push-scheduler
#     concurrency group so only one loop ever runs.
#
# Why this exists: every notification (My Day reminders, renewals, unlocks,
# FlowPath jobs, product/content announcements) is delivered by the server
# scheduler, so it has to be pinged every minute — whether or not the app is
# open. Vercel's Hobby plan caps cron at ONE run per day, so an external
# timer must drive it.
#
# ── Why each run LOOPS for ~5 hours instead of pinging once ─────────────────
# GitHub's `schedule` trigger is best-effort, not real-time. On this
# repository the minute cron delivered start events 11–79 minutes apart at
# first and later 1h20m–5h20m apart, frequently dropping events entirely.
# A single ping (or the old 21-minute loop) therefore left multi-hour holes:
# a reminder in the hole arrived late, or — past the catch-up cap — never.
#
# The fix: every scheduled start runs a ~5-hour loop (GitHub caps a job at
# 6h) pinging every 60s. Even when starts are 5h apart, the active loop is
# still pinging when the next start queues, and the queued loop begins the
# instant the active one ends — near-continuous coverage. The backup
# workflow doubles the odds of a timely start. The endpoint's own catch-up
# window (resolveLookbackMs, capped at 2h; override with the
# MYDAY_MAX_CATCHUP_HOURS env var) absorbs any residual hole.
#
# This repository is public, so GitHub-hosted runner minutes are free.
# NOTE: GitHub disables scheduled workflows after ~60 days without
# repository activity — any commit to the default branch re-enables them.
#
# Setup (one time):
#   1. Repo → Settings → Secrets and variables → Actions
#   2. Add secret  CRON_SECRET     — same value as the Vercel env var
#   3. Add secret  SCHEDULER_URL   — https://<your-domain>/api/cron/subscription-renewals
#
# The daily Vercel cron stays as a safety net: if this workflow is disabled
# or GitHub has an outage, the catch-up window still sweeps up anything
# recently missed (see resolveLookbackMs in utils/pushScheduler.js).

name: Push scheduler

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

concurrency:
  group: push-scheduler
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Run scheduler ping loop
        uses: ./.github/actions/ping-loop
        with:
          loop-minutes: 300
