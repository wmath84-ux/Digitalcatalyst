# Single-package workspace: the root package.json IS the only package.
# A `packages:` list is required by pnpm 9/10 whenever this file exists —
# omitting it makes `pnpm install` fail with "packages field missing or
# empty", which breaks Vercel's serverless-function dependency install.
packages:
  - "."

allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true
  sharp: true
