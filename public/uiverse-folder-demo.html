<!DOCTYPE html>
<!--
  uiverse-folder-demo.html — standalone preview of the uiverse.io "Card"
  (byllzz / great-wombat-13, MIT) burst that src/course/ModuleFolderBurst.tsx
  plays on the Course Player's Module dock button. Same stylesheet
  (src/course/uiverse-folder-card.css) and the same phase machine:
  click → closed card appears → opens (exact uiverse animation, full length)
  → holds → closes back into icon form.
  In the real app the trigger is a click on the existing Module dock tab;
  here the dock button below replays it. Open with the dev server:
  /uiverse-folder-demo.html
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uiverse folder burst — Module dock button preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        background: #0a0c12;
        font-family: "Inter", sans-serif;
        padding-bottom: 48px;
        gap: 26px;
      }
      .stage {
        position: relative;
        width: min(560px, 92vw);
        height: 300px;
        border-radius: 20px;
        background: linear-gradient(160deg, #131722 0%, #1b2030 100%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .stage p {
        position: absolute;
        top: 14px;
        left: 16px;
        right: 16px;
        color: rgba(255, 255, 255, 0.45);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.02em;
        line-height: 1.6;
      }
      /* The dock strip — stands in for the player's GlassDock footer. */
      .dock {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        padding: 10px 14px 12px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .dock button {
        width: 44px;
        height: 44px;
        border: 1px solid rgba(255, 190, 11, 0.22);
        border-radius: 12px;
        background: rgba(255, 190, 11, 0.14);
        color: #ffbe0b;
        font: inherit;
        font-size: 17px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .dock button span:last-child { color: rgba(255, 255, 255, 0.55); font-size: 15px; }
      .dock button.fake { border-color: rgba(255, 255, 255, 0.12); background: rgba(255, 255, 255, 0.05); color: rgba(255, 255, 255, 0.4); }
    </style>
  </head>
  <body>
    <div class="stage">
      <p>
        Course Player → Module dock button → uiverse.io/byllzz/great-wombat-13 burst.<br />
        Click the yellow Module tab below: the folder appears in icon form, plays the
        exact open animation in full, then closes back into icon form. The dock button
        itself is never replaced.
      </p>
      <div class="uiverse-folder-burst" id="burst" style="display: none"></div>
    </div>
    <div class="dock" id="dock">
      <button type="button" data-tab="modules" aria-label="Module">▶<span>·</span></button>
      <button type="button" class="fake" aria-label="Brain">✦</button>
      <button type="button" class="fake" aria-label="Note">✎</button>
      <button type="button" class="fake" aria-label="AI">✧</button>
    </div>
    <template id="card">
      <label class="folder-card">
        <input type="checkbox" class="folder-toggle" />

        <div class="hint-wrapper">
          <span class="hint-text">Click to open</span>
          <svg class="hint-arrow" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 35 5 C 35 5, 15 5, 10 25 M 10 25 L 3 18 M 10 25 L 18 22" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>

        <div class="folder-container">
          <svg class="folder-back" viewBox="0 0 50 40" fill="none">
            <path d="M0 4C0 1.79086 1.79086 0 4 0H16.524C17.721 0 18.8415 0.54051 19.574 1.4673L22.426 5.0654C23.1585 5.99219 24.279 6.5327 25.476 6.5327H46C48.2091 6.5327 50 8.32356 50 10.5327V36C50 38.2091 48.2091 40 46 40H4C1.79086 40 0 38.2091 0 36V4Z" fill="#0056b3"></path>
          </svg>

          <div class="folder-search">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" placeholder="Search files..." class="search-input" readonly />
          </div>

          <div class="file file-5">
            <div class="shine"></div>
            <svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <div class="file-text">Hero_BG.png</div>
            <div class="file-tag">PNG • 4.2 MB</div>
          </div>

          <div class="file file-4">
            <div class="shine"></div>
            <svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="23 7 16 12 23 17 23 7"></polygon>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
            </svg>
            <div class="file-text">Promo_Cut.mp4</div>
            <div class="file-tag">MP4 • 128 MB</div>
          </div>

          <div class="file file-3">
            <div class="shine"></div>
            <svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="16 18 22 12 16 6"></polyline>
              <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
            <div class="file-text">app_config.json</div>
            <div class="file-tag">JSON • 12 KB</div>
          </div>

          <div class="file file-2">
            <div class="shine"></div>
            <svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            <div class="file-text">Q3_Report.pdf</div>
            <div class="file-tag">PDF • 1.1 MB</div>
          </div>

          <div class="file file-1">
            <div class="shine"></div>
            <svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
            <div class="file-text">Pitch_Deck.pptx</div>
            <div class="file-tag">PPTX • 8.4 MB</div>
          </div>

          <div class="folder-front-wrapper">
            <svg class="folder-front" viewBox="0 0 50 34" fill="none">
              <path d="M0 4C0 1.79086 1.79086 0 4 0H46C48.2091 0 50 1.79086 50 4V30C50 32.2091 48.2091 34 46 34H4C1.79086 34 0 32.2091 0 30V4Z" fill="rgba(0, 123, 255, 0.65)"></path>
            </svg>
            <div class="folder-label"></div>
            <div class="counter">
              <div class="status-dot"></div>
              <span class="counter-label">FILES</span>
              <span class="counter-number">05</span>
            </div>
          </div>
        </div>
      </label>
    </template>
    <script>
      // The burst stylesheet lives with the app source — inline-imported here
      // by the dev server so this preview always uses the production CSS.
      fetch("/src/course/uiverse-folder-card.css")
        .then((r) => (r.ok ? r.text() : Promise.reject(new Error(String(r.status)))))
        .then((css) => {
          const style = document.createElement("style");
          style.textContent = css;
          document.head.appendChild(style);
        })
        .catch(() => {
          const style = document.createElement("style");
          style.textContent = "/* dev server CSS not reachable — build the app first */";
          document.head.appendChild(style);
        });

      const OPEN_HOLD_MS = 2600;
      const CLOSE_MS = 1000;
      const layer = document.getElementById("burst");
      const template = document.getElementById("card");
      const dockButton = document.querySelector('[data-tab="modules"]');
      let busy = false;

      dockButton.addEventListener("click", () => {
        if (busy) return;
        busy = true;

        // Anchor: fixed (the app stylesheet's own root rule), centred above
        // the tapped button — viewport coordinates, exactly like the app.
        const rect = dockButton.getBoundingClientRect();
        const CARD_W = 170;
        const vw = window.innerWidth;
        const maxLeft = Math.max(8, vw - CARD_W - 82);
        const left = Math.min(Math.max(rect.left + rect.width / 2 - CARD_W / 2, 8), maxLeft);
        layer.style.left = left + "px";
        layer.style.bottom = window.innerHeight - rect.top + 10 + "px";

        layer.replaceChildren(template.content.cloneNode(true));
        layer.style.display = "";
        const toggle = layer.querySelector(".folder-toggle");

        // mount (closed, painted) → open → hold → close → gone
        requestAnimationFrame(() =>
          requestAnimationFrame(() => {
            toggle.checked = true;
            setTimeout(() => {
              toggle.checked = false;
              setTimeout(() => {
                layer.style.display = "none";
                layer.replaceChildren();
                busy = false;
              }, CLOSE_MS);
            }, OPEN_HOLD_MS);
          }),
        );
      });
    </script>
  </body>
</html>
