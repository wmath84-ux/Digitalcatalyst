
<!DOCTYPE html>

    <meta name="mobile-web-app-capable" content="yes" />

    <title>Digital Catalyst | Notes, Courses & AI Learning Store</title>
    <meta name="description" content="A premium marketplace for online notes, rich learning documents, private video courses, subscriptions, coupons, reviews, and AI-assisted study inside Digital Catalyst." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // Now using CSS variables for dynamic theming
              primary: 'var(--color-primary)',
              accent: 'var(--color-accent)',
              background: 'var(--color-background)',
              text: 'var(--color-text)',
              'text-muted': 'var(--color-text-muted)',
              'razorpay-blue': 'var(--color-primary)', // Legacy support
              'razorpay-light-blue': 'var(--color-primary)', // Legacy support
            },
            fontFamily: {
              sans: ['var(--font-sans)', 'sans-serif'],
              serif: ['var(--font-serif)', 'serif'],
            },
            borderRadius: {
                'none': '0px',
                'sm': '0.125rem',
                '': '0.25rem',
                'md': '0.375rem',
                'lg': 'var(--style-corner-radius, 0.5rem)',
                'xl': 'calc(var(--style-corner-radius, 0.5rem) * 1.5)',
                '2xl': 'calc(var(--style-corner-radius, 0.5rem) * 2)',
                '3xl': 'calc(var(--style-corner-radius, 0.5rem) * 3)',
                'full': '9999px',
            },
            boxShadow: {
                'sm': '0 1px 2px 0 rgb(0 0 0 / 0.05)',
                '': 'var(--style-shadow-base, 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1))',
                'md': 'var(--style-shadow-base, 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1))',
                'lg': 'var(--style-shadow-lg, 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1))',
                'xl': 'var(--style-shadow-xl, 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1))',
                '2xl': '0 25px 50px -12px rgb(0 0 0 / 0.25)',
                'inner': 'inset 0 2px 4px 0 rgb(0 0 0 / 0.05)',
                'none': 'none',
            },
            animation: {
              'gradient-flow': 'gradient-flow 15s ease infinite',
              'fade-in-up': 'fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'fade-in': 'fade-in 0.6s ease-out forwards',
              'scale-in-up': 'scale-in-up 0.6s ease-out forwards',
              'pop-in': 'pop-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
              'slide-in-left': 'slide-in-left 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'zoom-in': 'zoom-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            },
            keyframes: {
              'gradient-flow': {
                '0%, 100%': { backgroundPosition: '0% 50%' },
                '50%': { backgroundPosition: '100% 50%' },
              },
              'fade-in-up': {
                from: { opacity: '0', transform: 'translateY(30px)' },
                to: { opacity: '1', transform: 'translateY(0)' },
              },
              'fade-in': {
                from: { opacity: '0' },
                to: { opacity: '1' },
              },
              'scale-in-up': {
                from: { opacity: '0', transform: 'scale(0.95) translateY(10px)' },
                to: { opacity: '1', transform: 'scale(1) translateY(0)' },
              },
              'pop-in': {
                '0%': { transform: 'scale(0.9)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              },
              'slide-in-left': {
                from: { opacity: '0', transform: 'translateX(-30px)' },
                to: { opacity: '1', transform: 'translateX(0)' },
              },
              'zoom-in': {
                from: { opacity: '0', transform: 'scale(0.9)' },
                to: { opacity: '1', transform: 'scale(1)' },
              },
            }
          }
        }
      }
    </script>
     <style>
      html {
        scroll-behavior: smooth;
      }

      html, body, #root {
        width: 100%;
        max-width: 100%;
        min-height: 100%;
        margin: 0;
        overflow-x: clip;
        box-sizing: border-box;
      }

      @supports not (overflow: clip) {
        html, body, #root { overflow-x: hidden; }
      }

      *, *::before, *::after { box-sizing: inherit; }

      :root {
        --apple-fluid-curve: cubic-bezier(0.16, 1, 0.3, 1);
        --mobile-bg: #F8FBFF;
        --mobile-bg-soft: #EEF6FF;
        --mobile-card: #FFFFFF;
        --mobile-heading: #081A45;
        --mobile-body: #536178;
        --mobile-muted: #7C879A;
        --mobile-primary: #1769FF;
        --mobile-violet: #7B61FF;
        --mobile-border: #D9E7F8;
        --mobile-border-active: #BFD7FF;
        --mobile-page-gradient: radial-gradient(circle at 12% 8%, rgba(191, 215, 255, 0.72), transparent 32%), radial-gradient(circle at 88% 10%, rgba(123, 97, 255, 0.18), transparent 28%), linear-gradient(180deg, var(--mobile-bg) 0%, var(--mobile-bg-soft) 100%);
      }

      /* Course player YouTube fullscreen safety */
      .course-player-content-frame {
        isolation: isolate;
      }

      /* Native HTML5 Google Drive media player inside course player */
      .course-drive-native-embed {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: #000;
      }

      .course-drive-html5-video {
        display: block;
        width: 100% !important;
        height: 100% !important;
        min-width: 0;
        min-height: 0;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        background: #000;
      }

      .course-drive-native-audio-embed {
        padding: clamp(0.75rem, 2.5vmin, 1.5rem);
        background: linear-gradient(135deg, #081A45 0%, #111827 52%, #000 100%);
      }

      .course-drive-html5-audio {
        display: block;
        width: min(100%, 760px) !important;
        max-width: 100%;
      }

      .course-drive-native-iframe {
        display: block;
        width: 100% !important;
        height: 100% !important;
        min-width: 0;
        min-height: 0;
        border: 0 !important;
        background: #fff;
      }

      @media (max-width: 767px) {
        .course-drive-native-embed,
        .course-drive-html5-video,
        .course-drive-native-iframe {
          width: 100% !important;
          height: 100% !important;
          max-width: 100% !important;
          max-height: 100% !important;
        }

        .course-drive-native-audio-embed {
          padding: 0.85rem;
        }
      }

      .course-youtube-frame,
      .course-youtube-player-shell,
      .course-native-video-shell {
        background: #000;
      }

      .course-youtube-player-shell,
      .course-native-video-shell {
        min-height: 100%;
        width: 100%;
      }

      .course-youtube-fullscreen-button,
      .course-native-video-fullscreen-button {
        -webkit-tap-highlight-color: transparent;
      }

      .course-native-video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }

      .course-youtube-iframe {
        display: block;
        width: 100% !important;
        height: 100% !important;
        max-width: none;
        max-height: none;
        background: #000;
      }

      .course-youtube-player-shell iframe,
      .course-youtube-player-shell iframe[style] {
        width: 100% !important;
        height: 100% !important;
        max-width: none !important;
        max-height: none !important;
      }

      .course-youtube-player-shell:fullscreen,
      .course-native-video-shell:fullscreen,
      .course-native-video:fullscreen {
        position: fixed !important;
        inset: 0 !important;
        width: 100% !important;
        width: 100dvw !important;
        height: 100% !important;
        height: 100dvh !important;
        min-width: 100% !important;
        min-height: 100% !important;
        max-width: none !important;
        max-height: none !important;
        margin: 0 !important;
        padding: 0 !important;
        border: 0 !important;
        border-radius: 0 !important;
        background: #000 !important;
        object-fit: contain !important;
        overflow: hidden !important;
      }

      .course-youtube-player-shell:fullscreen .course-youtube-iframe,
      .course-youtube-player-shell:fullscreen iframe,
      .course-youtube-player-shell:-webkit-full-screen .course-youtube-iframe,
      .course-youtube-player-shell:-webkit-full-screen iframe,
      .course-native-video-shell:fullscreen .course-native-video,
      .course-native-video-shell:-webkit-full-screen .course-native-video {
        position: absolute !important;
        inset: 0 !important;
        width: 100% !important;
        width: 100dvw !important;
        height: 100% !important;
        height: 100dvh !important;
        min-width: 100% !important;
        min-height: 100% !important;
        max-width: none !important;
        max-height: none !important;
        border: 0 !important;
        border-radius: 0 !important;
      }

      .course-youtube-player-shell:fullscreen .course-youtube-fullscreen-button,
      .course-youtube-player-shell:-webkit-full-screen .course-youtube-fullscreen-button {
        bottom: max(5rem, env(safe-area-inset-bottom)) !important;
        right: max(1rem, env(safe-area-inset-right)) !important;
        z-index: 2147483647 !important;
      }

      .course-native-video-shell:fullscreen .course-native-video-fullscreen-button,
      .course-native-video-shell:-webkit-full-screen .course-native-video-fullscreen-button {
        display: none !important;
      }

      .course-youtube-player-shell:-webkit-full-screen,
      .course-native-video-shell:-webkit-full-screen,
      .course-native-video:-webkit-full-screen {
        position: fixed !important;
        inset: 0 !important;
        width: 100% !important;
        width: 100dvw !important;
        height: 100% !important;
        height: 100dvh !important;
        min-width: 100% !important;
        min-height: 100% !important;
        max-width: none !important;
        max-height: none !important;
        margin: 0 !important;
        padding: 0 !important;
        border: 0 !important;
        border-radius: 0 !important;
        background: #000 !important;
        object-fit: contain !important;
        overflow: hidden !important;
      }

      @keyframes apple-app-open {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .animate-in.fade-in.zoom-in-95 {
        animation: apple-app-open 500ms var(--apple-fluid-curve) both;
        transform-origin: center;
        will-change: opacity, transform;
      }

      :where(button, a, [role="button"], [role="tab"], [role="menuitem"], .cursor-pointer, .product-card-shine, .hover-lift) {
        transition-timing-function: var(--apple-fluid-curve);
      }

      :where(button, a, [role="button"], [role="tab"], [role="menuitem"], .cursor-pointer, .product-card-shine, .hover-lift):active {
        transform: scale(0.97);
        transition-property: transform, opacity, background-color, border-color, color, box-shadow, filter, backdrop-filter;
        transition-duration: 200ms;
        transition-timing-function: ease-out;
      }

      @media (prefers-reduced-motion: reduce) {
        .animate-in.fade-in.zoom-in-95 {
          animation: none;
        }

        :where(button, a, [role="button"], [role="tab"], [role="menuitem"], .cursor-pointer, .product-card-shine, .hover-lift):active {
          transform: none;
        }
      }
      
      /* --- Utility Animations --- */
      
      /* Shine effect for cards */
      .product-card-shine {
        position: relative;
        overflow: hidden;
      }
      .product-card-shine::after {
        content: '';
        position: absolute;
        top: 0;
        left: -150%;
        width: 100%;
        height: 100%;
        background: linear-gradient(110deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 70%);
        transform: skewX(-25deg);
        transition: left 0.75s ease-in-out;
        pointer-events: none;
      }
      .product-card-shine:hover::after {
        left: 150%;
        transition: left 0.75s ease-in-out;
      }

      /* Simple scroll trigger for sections */
      .scroll-animate {
        opacity: 0;
        transform: translateY(40px);
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity, transform;
      }
      .scroll-animate.is-visible {
        opacity: 1 !important;
        transform: translateY(0) !important;
      }
      
      /* Staggered Animation Container */
      /* Parent element should have .stagger-animate-container */
      /* Children should have .animate-child */
      .stagger-animate-container .animate-child {
        opacity: 0;
        transform: translateY(30px);
        transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }
      
      /* When parent becomes visible, children animate in with delay */
      .stagger-animate-container.is-visible .animate-child {
        opacity: 1 !important;
        transform: translateY(0) !important;
      }
      
      /* Delays for up to 12 items */
      .stagger-animate-container.is-visible .animate-delay-1 { transition-delay: 0.05s; }
      .stagger-animate-container.is-visible .animate-delay-2 { transition-delay: 0.1s; }
      .stagger-animate-container.is-visible .animate-delay-3 { transition-delay: 0.15s; }
      .stagger-animate-container.is-visible .animate-delay-4 { transition-delay: 0.2s; }
      .stagger-animate-container.is-visible .animate-delay-5 { transition-delay: 0.25s; }
      .stagger-animate-container.is-visible .animate-delay-6 { transition-delay: 0.3s; }
      .stagger-animate-container.is-visible .animate-delay-7 { transition-delay: 0.35s; }
      .stagger-animate-container.is-visible .animate-delay-8 { transition-delay: 0.4s; }
      .stagger-animate-container.is-visible .animate-delay-9 { transition-delay: 0.45s; }
      .stagger-animate-container.is-visible .animate-delay-10 { transition-delay: 0.5s; }
      .stagger-animate-container.is-visible .animate-delay-11 { transition-delay: 0.55s; }
      .stagger-animate-container.is-visible .animate-delay-12 { transition-delay: 0.6s; }
      
      /* Failsafe: ensure opacity 1 if no JS or after animation */
      .no-js .scroll-animate, .no-js .animate-child {
          opacity: 1 !important;
          transform: none !important;
      }

      /* --- Interactive Hover Effects --- */
      .hover-lift {
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .hover-lift:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.15);
      }

      /* Cart Sidebar */
      .cart-overlay {
        position: fixed;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.6);
        z-index: 998;
        opacity: 0;
        transition: opacity 0.4s ease-in-out;
        pointer-events: none;
        backdrop-filter: blur(2px);
      }
      .cart-overlay.is-open {
        opacity: 1;
        pointer-events: auto;
      }
      .cart-sidebar {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        max-width: 400px;
        background: rgba(255, 255, 255, 0.8);
        border-left: 1px solid rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(40px);
        z-index: 999;
        transform: translateX(100%);
        transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: -25px 0 50px rgba(15, 23, 42, 0.16);
      }
      .cart-sidebar.is-open {
        transform: translateX(0);
      }

      /* Modal Basics */
      .common-modal-overlay {
        position: fixed;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.7);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(5px);
        opacity: 0;
        animation: fade-in 0.3s forwards;
      }
      .common-modal-content {
        background: white;
        border-radius: 1rem;
        box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        opacity: 0;
        transform: scale(0.95);
        animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      /* Special Utilities */
      .cart-toast {
        position: fixed;
        top: 5.5rem; /* Below header */
        right: 1.5rem;
        background-color: var(--color-primary);
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 9999px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        font-weight: 600;
        z-index: 1001;
        transform: translateY(-20px) scale(0.95);
        opacity: 0;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        pointer-events: none;
      }
      .cart-toast.is-visible {
        transform: translateY(0) scale(1);
        opacity: 1;
      }

      /* Coming Soon / Feature Modals */
      .coming-soon-overlay, .share-modal-overlay {
         @extend .common-modal-overlay;
         position: fixed;
         inset: 0;
         background-color: rgba(0, 0, 0, 0.75);
         z-index: 1000;
         display: flex;
         align-items: center;
         justify-content: center;
         backdrop-filter: blur(4px);
         animation: fade-in 0.3s ease-out forwards;
      }
      
      .coming-soon-content, .share-modal-content {
         @extend .common-modal-content;
         animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
      
      /* Feature Accordion */
      .feature-accordion-header {
        cursor: pointer;
        transition: background-color 0.2s ease-out;
      }
      .feature-accordion-header:hover {
        background-color: #f9fafb; /* gray-50 */
      }
      .feature-accordion-content {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), padding 0.3s ease;
      }
      .feature-accordion-content.is-open {
        max-height: 300px;
        padding-top: 0.5rem;
        padding-bottom: 1rem;
      }

      /* Floating Icon Animation */
      @keyframes icon-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      .animate-icon-float {
        animation: icon-float 3s ease-in-out infinite;
      }
      
      /* Price Flash */
      @keyframes price-flash-anim {
        0% { transform: scale(1); background-color: transparent; }
        30% { transform: scale(1.05); background-color: #dbeafe; }
        100% { transform: scale(1); background-color: transparent; }
      }
      .price-flash {
        animation: price-flash-anim 0.6s ease-out;
      }
      
      .subtotal-flash {
        animation: subtotal-flash-anim 0.6s ease;
      }
      @keyframes subtotal-flash-anim {
        0% { background-color: transparent; }
        50% { background-color: #dbeafe; }
        100% { background-color: transparent; }
      }

    
      @keyframes typing { from { width: 0 } to { width: 100% } }
      @keyframes blink { 50% { border-color: transparent; } }
      @keyframes slideUp { from { opacity: 0; transform: translateY(16px);} to { opacity: 1; transform: translateY(0);} }
      @keyframes welcomeCirclePop {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes welcomeCircleDraw {
        from { stroke-dashoffset: 295.31; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes welcomeTextWrite {
        from { opacity: 1; clip-path: inset(0 100% 0 0); }
        to { opacity: 1; clip-path: inset(0 0 0 0); }
      }
      @keyframes welcomeCaretBlink {
        0%, 45% { opacity: 1; }
        46%, 100% { opacity: 0; }
      }
      @keyframes welcomeSpark {
        0% { opacity: 0; transform: scale(0.4); }
        20%, 82% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(0.35); }
      }
      .welcome-circle-draw {
        stroke-dasharray: 295.31;
        stroke-dashoffset: 295.31;
        animation: welcomeCircleDraw 2s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }
      .welcome-write-text {
        display: inline-block;
        opacity: 0;
        position: relative;
        animation: welcomeTextWrite 2s steps(7, end) forwards;
      }
      .welcome-write-text::after {
        background: currentColor;
        content: '';
        height: 0.88em;
        position: absolute;
        right: -0.14em;
        top: 0.12em;
        width: 0.045em;
        animation: welcomeCaretBlink 0.5s steps(1, end) 4 both;
      }


      @keyframes slide-in-right {
        from { transform: translateX(100%); }
        to { transform: translateX(0); }
      }
      .animate-slide-in-right {
        animation: slide-in-right 0.42s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      @keyframes article-hero-image-reveal {
        from { opacity: 0; transform: scale(0.96); filter: blur(8px); }
        to { opacity: 0.9; transform: scale(1); filter: blur(0); }
      }
      .animate-article-hero-image {
        animation: article-hero-image-reveal 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        transform-origin: center;
        will-change: opacity, transform, filter;
      }


      /* Tagmaster color system shared from the Community > Tag'master page. */
      :where(.tagmaster-section-theme, .tagmaster-admin-theme) {
        --tagmaster-ink: #202124;
        --tagmaster-muted: #5F6368;
        --tagmaster-blue: #1A73E8;
        --tagmaster-blue-strong: #1967D2;
        --tagmaster-blue-deep: #174EA6;
        --tagmaster-blue-soft: #E8F0FE;
        --tagmaster-blue-mid: #D3E3FD;
        --tagmaster-blue-border: #D2E3FC;
        --tagmaster-blue-border-strong: #C2E7FF;
        --tagmaster-border: #E0E3EB;
        --tagmaster-surface: #FFFFFF;
        --tagmaster-page: #F8FAFD;
        --tagmaster-green-soft: #E6F4EA;
        --tagmaster-green: #137333;
        --tagmaster-yellow-soft: #FEF7E0;
        --tagmaster-yellow: #B06000;
        --tagmaster-red-soft: #FCE8E6;
        --tagmaster-red-border: #FAD2CF;
        --tagmaster-red: #C5221F;
        color: var(--tagmaster-ink) !important;
      }
