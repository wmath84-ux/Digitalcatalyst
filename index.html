<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Dark by default so it matches the boot splash; the app switches it to
         light as soon as a light screen renders (see src/utils/themeColor.ts). -->
    <meta name="theme-color" content="#05060f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="google-site-verification" content="6eLv1FI47zrzjUwJu35mWI1sMzzTeyn0Mwgn_dMBUJw" />
    <!-- Static manifest so Chrome/Android can install the PWA even when the
         serverless /api/manifest route is down, rewritten, or returning
         leaderboard JSON. Branding still upgrades this link to /api/manifest
         after a successful installability probe. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.svg" />
    <title>Eduvora | Digital Catalyst</title>
    <style>
      /* Boot splash paints the same Black Ice backdrop as src/glass-theme.css (§2) so the pre-React frame and the app share one background — no white/indigo flash. */
      html { background-color: #0a0c12; }
      .app-boot-splash { position: fixed; inset: 0; z-index: 2147483000; min-height: 100dvh; display: grid; place-items: center; padding: 0; color: #fff; background-color: #0a0c12; background-image: radial-gradient(58% 72% at 12% 30%, rgb(44 53 126 / 0.95) 0%, rgb(37 48 143 / 0.42) 38%, transparent 68%), radial-gradient(52% 60% at 40% 80%, rgb(18 117 106 / 0.72) 0%, rgb(15 95 87 / 0.3) 40%, transparent 70%), radial-gradient(46% 56% at 90% 15%, rgb(109 33 132 / 0.8) 0%, rgb(122 36 136 / 0.34) 42%, transparent 72%), radial-gradient(70% 40% at 45% 5%, rgb(58 33 89 / 0.6) 0%, transparent 70%), radial-gradient(120% 90% at 50% 100%, rgb(6 7 12 / 0.85) 0%, transparent 55%); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .app-boot-video { width: 100%; height: 100%; object-fit: contain; background-color: #000; }
      @media (prefers-reduced-motion: reduce) { .app-boot-video { display: none; } }
    </style>
  </head>
  <body>
    <!-- Exact EduOS opening animation. Lives outside #root so React mount
         cannot restart or replace the video. On by default; hidden only when
         branding has the opening animation turned off. -->
    <div id="app-opening-splash" class="app-boot-splash" role="status" aria-label="Loading Eduvora" style="display:none">
      <video
        id="app-opening-video"
        class="app-boot-video"
        muted
        playsinline
        webkit-playsinline
        preload="auto"
        disablepictureinpicture
      ></video>
    </div>
    <div id="root"></div>
    <!-- Apply cached branding to the boot splash + document title BEFORE the
         React bundle loads, so a renamed app never flashes "Eduvora" on reload.
         The live Firestore values overwrite this once BrandingProvider mounts. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("eduvora.branding.v2");
          var legacy = localStorage.getItem("eduvora.brandLogoUrl.v1");
          var data = raw ? JSON.parse(raw) : {};
          var name = (data.appName || "Eduvora").toString().trim().slice(0, 40);
          var tagline = (data.tagline || "Digital Catalyst").toString().trim().slice(0, 80);
          var logo = (data.logoUrl || legacy || "/icons/icon-192x192.svg").toString();
          var openingAnimationEnabled = data.openingAnimationEnabled !== false;
          var hideFrameBorders = data.hideFrameBorders !== false;
          document.documentElement.dataset.hideFrameBorders = String(hideFrameBorders);
          if (!/^https?:\/\//.test(logo) && !logo.startsWith("/")) logo = "/icons/icon-192x192.svg";
          if (name) {
            document.title = tagline ? name + " | " + tagline : name;
          }
          var splash = document.getElementById("app-opening-splash") || document.querySelector(".app-boot-splash");
          if (splash && name) splash.setAttribute("aria-label", "Loading " + name);
          var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          var isMobile = window.innerWidth < 768;
          var video = document.getElementById("app-opening-video");
          if (video) {
            video.src = isMobile
              ? "/assets/animations/EduOS_app_opening_mobile.mp4"
              : "/assets/animations/EduOS_app_opening_desktop.mp4";
          }
          if (splash && openingAnimationEnabled && !reduceMotion) {
            splash.style.display = "";
            if (video && video.play) {
              var playing = video.play();
              if (playing && playing.catch) playing.catch(function () {});
            }
          }
        } catch (e) { /* private mode / corrupt cache — keep static defaults */ }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
