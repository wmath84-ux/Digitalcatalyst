<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Dark by default so it matches the boot splash; the app switches it to
         light as soon as a light screen renders (see src/utils/themeColor.ts). -->
    <meta name="theme-color" content="#05060f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="google-site-verification" content="6eLv1FI47zrzjUwJu35mWI1sMzzTeyn0Mwgn_dMBUJw" />
    <!-- Static manifest so Chrome/Android can install the PWA even when the
         serverless /api/manifest route is down, rewritten, or returning
         leaderboard JSON. Branding still upgrades this link to /api/manifest
         after a successful installability probe. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.svg" />
    <title>Eduvora | Digital Catalyst</title>
    <style>
      /* Boot splash paints the same Black Ice backdrop as src/glass-theme.css (§2) so the pre-React frame and the app share one background — no white/indigo flash. */
      html { background-color: #0a0c12; }
      /* ── The app opening animation (see src/utils/openingSplash.ts) ─────────
         Two layers, always both present in the DOM:
           · .app-boot-fallback — a CSS-only brand card. Paints with no JS at
             all, so the opening can never be a blank screen.
           · .app-boot-video    — the exact EduOS MP4 (mobile vs desktop clip).
             It fades IN over the card only once it has painted a real frame, so
             a missing/slow/undecodable file degrades to the card instead of to
             "nothing".
         Hiding is state-driven (`data-opening`), never an inline `display`
         style: an inline style written during one bad boot used to survive the
         next re-show and switch the opening off permanently. */
      .app-boot-splash { position: fixed; inset: 0; z-index: 2147483000; min-height: 100dvh; display: grid; place-items: center; padding: 0; color: #fff; background-color: #0a0c12; background-image: radial-gradient(58% 72% at 12% 30%, rgb(44 53 126 / 0.95) 0%, rgb(37 48 143 / 0.42) 38%, transparent 68%), radial-gradient(52% 60% at 40% 80%, rgb(18 117 106 / 0.72) 0%, rgb(15 95 87 / 0.3) 40%, transparent 70%), radial-gradient(46% 56% at 90% 15%, rgb(109 33 132 / 0.8) 0%, rgb(122 36 136 / 0.34) 42%, transparent 72%), radial-gradient(70% 40% at 45% 5%, rgb(58 33 89 / 0.6) 0%, transparent 70%), radial-gradient(120% 90% at 50% 100%, rgb(6 7 12 / 0.85) 0%, transparent 55%); font-family: Inter, ui-sans-serif, system-ui, sans-serif; overflow: hidden; opacity: 1; transition: opacity 380ms ease; }
      .app-boot-splash[data-hiding="1"] { opacity: 0; pointer-events: none; }
      #app-opening-splash[data-opening="skipped"], #app-opening-splash[data-opening="done"] { display: none !important; }
      /* A stale inline shell (service-worker cache) has no controller to hide
         us with, so CSS dismisses the splash on its own after 11 s. */
      #app-opening-splash { animation: app-boot-failsafe 10ms linear 11s forwards; }
      @keyframes app-boot-failsafe { to { opacity: 0; visibility: hidden; display: none; } }
      .app-boot-video { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: contain; background-color: #000; opacity: 0; transition: opacity 240ms ease; }
      .app-boot-splash[data-video="on"] .app-boot-video { opacity: 1; }
      .app-boot-fallback { position: relative; z-index: 1; display: grid; place-items: center; gap: 1.15rem; width: min(88vw, 30rem); opacity: 1; transition: opacity 240ms ease; }
      .app-boot-splash[data-video="on"] .app-boot-fallback { opacity: 0; }
      .app-boot-ring { display: block; width: 4.5rem; height: 4.5rem; border-radius: 9999px; border: 2px solid rgb(255 255 255 / 0.16); border-top-color: #a78bfa; border-right-color: #22d3ee; animation: app-boot-spin 1.15s linear infinite; }
      @keyframes app-boot-spin { to { transform: rotate(360deg); } }
      .app-boot-name { position: relative; margin: 0; font-size: clamp(1.15rem, 4.6vw, 1.9rem); font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; text-align: center; background-image: linear-gradient(92deg, #c7d2fe, #e0f2fe 45%, #ddd6fe); -webkit-background-clip: text; background-clip: text; color: transparent; animation: app-boot-name-in 900ms cubic-bezier(0.22, 1, 0.36, 1) both; }
      @keyframes app-boot-name-in { from { opacity: 0; letter-spacing: 0.5em; filter: blur(6px); } to { opacity: 1; letter-spacing: 0.14em; filter: none; } }
      .app-boot-shine { position: absolute; inset-block: 0; left: 0; width: 42%; pointer-events: none; background-image: linear-gradient(100deg, transparent, rgb(255 255 255 / 0.12), transparent); transform: translateX(-150%); animation: app-boot-shine 2.7s ease-in-out 0.4s infinite; }
      @keyframes app-boot-shine { 0% { transform: translateX(-150%); } 55% { transform: translateX(210%); } 100% { transform: translateX(210%); } }
      #app-opening-splash, #app-opening-splash * { max-width: none !important; }
      /* Reduced motion means "no motion", NOT "nothing": the card stays and the
         clip is swapped out by src/utils/openingSplash.ts. The old
         `#app-opening-splash { display: none }` here is precisely why the
         opening was invisible on every screen for anyone with Android's
         "Reduce animation" / Windows "animation effects off" / iOS "Reduce
         Motion" turned on. */
      @media (prefers-reduced-motion: reduce) {
        .app-boot-splash * { animation: none !important; transition: none !important; }
        #app-opening-splash { animation: app-boot-failsafe 10ms linear 11s forwards !important; }
      }
    </style>
  </head>
  <body>
    <!-- Exact EduOS opening animation. Lives outside #root so a React remount
         cannot restart, cover or "finish" the video. The opening is ON by
         default; hidden only when branding turns it off, when the device asked
         for it via ?opening=off, or while offline. -->
    <div id="app-opening-splash" class="app-boot-splash" role="status" aria-label="Loading Eduvora">
      <video
        id="app-opening-video"
        class="app-boot-video"
        muted
        autoplay
        playsinline
        webkit-playsinline
        preload="auto"
        disablepictureinpicture
        aria-hidden="true"
      ></video>
      <div class="app-boot-fallback" aria-hidden="true">
        <span class="app-boot-ring"></span>
        <p class="app-boot-name"></p>
        <span class="app-boot-shine"></span>
      </div>
    </div>
    <div id="root"></div>
    <!-- Pre-React boot: cached branding (title + splash label) and the FIRST
         attempt at the opening clip, so the video starts downloading and
         playing before the bundle executes. Nothing else: the decision table,
         the frame-timeout fallback and the teardown all live in
         src/utils/openingSplash.ts, which re-adopts this <video>. The clip
         choice below intentionally mirrors openingClipForWidth(); the contract
         test in tests/openingSplashContract.test.mjs keeps the two in sync. -->
    <script>
      (function () {
        var REDUCE = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var splash = document.getElementById("app-opening-splash");
        var video = document.getElementById("app-opening-video");
        var name = "Eduvora";
        var tagline = "Digital Catalyst";
        var enabled = true;
        var hideFrameBorders = true;
        var override = "";
        try {
          var raw = localStorage.getItem("eduvora.branding.v2");
          var legacy = localStorage.getItem("eduvora.brandLogoUrl.v1");
          var data = raw ? JSON.parse(raw) : {};
          name = (data.appName || "Eduvora").toString().trim().slice(0, 40) || "Eduvora";
          tagline = (data.tagline || "Digital Catalyst").toString().trim().slice(0, 80);
          var logo = (data.logoUrl || legacy || "/icons/icon-192x192.svg").toString();
          if (!/^https?:\/\//.test(logo) && !logo.startsWith("/")) logo = "/icons/icon-192x192.svg";
          document.documentElement.dataset.hideFrameBorders = String(data.hideFrameBorders !== false);
          enabled = data.openingAnimationEnabled !== false;
          if (data.logoUrl) {
            var icon = document.createElement("link");
            icon.rel = "icon";
            icon.href = logo;
            document.head.appendChild(icon);
          }
          override = (localStorage.getItem("eduvora.opening.override.v1") || "").toLowerCase();
        } catch (e) { /* private mode / corrupt cache — keep static defaults */ }

        try {
          var query = new URLSearchParams(location.search).get("opening") || "";
          var tokens = (query + "," + override).toLowerCase().split(/[,\s]+/);
          override = tokens.indexOf("off") > -1 ? "off"
            : tokens.indexOf("force") > -1 ? "force"
            : tokens.indexOf("on") > -1 ? "on"
            : tokens.indexOf("static") > -1 ? "static"
            : tokens.indexOf("debug") > -1 ? "debug" : "";
        } catch (e) { override = ""; }

        if (name) document.title = tagline ? name + " | " + tagline : name;
        if (splash) splash.setAttribute("aria-label", "Loading " + name);

        var card = splash && splash.querySelector(".app-boot-name");
        if (card) card.textContent = name;

        // Same rule as openingClipForWidth(): phones get the portrait clip.
        var isMobile = window.innerWidth < 768;
        var src = isMobile
          ? "/assets/animations/EduOS_app_opening_mobile.mp4"
          : "/assets/animations/EduOS_app_opening_desktop.mp4";
        var offline = navigator.onLine === false;
        var show = override !== "off" && (enabled || override === "on" || override === "force") && !(offline && override !== "force");
        var playClip = show && override !== "static" && !(REDUCE && override !== "force");

        if (splash && !show) splash.dataset.opening = "skipped";
        if (video) {
          video.muted = true;
          video.playsInline = true;
          video.setAttribute("playsinline", "");
          video.setAttribute("src", src);
        }
        if (splash) splash.dataset.preReact = "boot";
        if (playClip && video) {
          var playing = video.play();
          if (playing && playing.catch) playing.catch(function () {});
        } else if (video) {
          // Reduced motion / static: never decode the clip, just show the card.
          try { video.pause(); } catch (e) {}
          if (splash && show) splash.setAttribute("data-motion", "reduce");
        }
        window.__eduosBoot = { clip: isMobile ? "mobile" : "desktop", src: playClip ? src : null, t0: Date.now(), reducedMotion: REDUCE };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
