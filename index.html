    <script>
      (() => {
        try {
          const storedMode = JSON.parse(localStorage.getItem('siteColorExperience') || 'null');
          const cachedSettings = JSON.parse(localStorage.getItem('websiteSettings') || 'null');
          const cachedMode = cachedSettings?.theme?.colorExperience;
          const supportedModes = ['original', 'immersive', 'warm', 'modern-white', 'classic'];
          const mode = supportedModes.includes(storedMode)
            ? storedMode
            : supportedModes.includes(cachedMode)
              ? cachedMode
              : 'immersive';
          document.documentElement.dataset.colorExperience = mode;
        } catch (error) {
          document.documentElement.dataset.colorExperience = 'immersive';
        }
      })();
    </script>
    <script>
      (() => {
        const preventGesture = (event) => event.preventDefault();
        document.addEventListener('gesturestart', preventGesture, { passive: false });
        document.addEventListener('gesturechange', preventGesture, { passive: false });
        document.addEventListener('gestureend', preventGesture, { passive: false });
        document.addEventListener('touchmove', (event) => {
          if (event.touches && event.touches.length > 1) event.preventDefault();
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', (event) => {
          const now = Date.now();
          if (now - lastTouchEnd <= 300) event.preventDefault();
          lastTouchEnd = now;
        }, { passive: false });

        const setViewportVars = () => {
          const viewport = window.visualViewport;
          const width = Math.round(viewport?.width || window.innerWidth || document.documentElement.clientWidth || 0);
          const height = Math.round(viewport?.height || window.innerHeight || document.documentElement.clientHeight || 0);
          document.documentElement.style.setProperty('--app-vh', `${height * 0.01}px`);
          document.documentElement.style.setProperty('--app-dvh', `${height}px`);
          document.documentElement.style.setProperty('--app-vw', `${width}px`);
          document.documentElement.dataset.orientation = width >= height ? 'landscape' : 'portrait';
          document.documentElement.classList.add('viewport-ready');
        };

        setViewportVars();
        requestAnimationFrame(setViewportVars);
        window.setTimeout(setViewportVars, 120);
        window.setTimeout(setViewportVars, 420);
        window.addEventListener('resize', setViewportVars, { passive: true });
        window.visualViewport?.addEventListener('resize', setViewportVars, { passive: true });
        window.addEventListener('orientationchange', () => {
          setViewportVars();
          window.setTimeout(setViewportVars, 80);
          window.setTimeout(setViewportVars, 260);
        }, { passive: true });
      })();
    </script>

     <style>

        overflow-x: clip;

      *, *::before, *::after { box-sizing: inherit; }

        min-height: 0;

        flex: 1 1 auto;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        padding: clamp(0.25rem, 1.25vmin, 0.9rem);
        background: #000;
      }

      .course-drive-fixed-viewport {
        position: relative;
        flex: 0 0 auto;
        overflow: hidden;

        max-height: none !important;

      @keyframes apple-app-open {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .animate-in.fade-in.zoom-in-95 {
        animation: apple-app-open 500ms var(--apple-fluid-curve) both;
        transform-origin: center;
        will-change: opacity, transform;
      }

      :where(button, a, [role="button"], [role="tab"], [role="menuitem"], .cursor-pointer, .product-card-shine, .hover-lift) {
        transition-timing-function: var(--apple-fluid-curve);
      }

      :where(button, a, [role="button"], [role="tab"], [role="menuitem"], .cursor-pointer, .product-card-shine, .hover-lift):active {
        transform: scale(0.97);
        transition-property: transform, opacity, background-color, border-color, color, box-shadow, filter, backdrop-filter;
        transition-duration: 200ms;
        transition-timing-function: ease-out;
      }

      @media (prefers-reduced-motion: reduce) {
        .animate-in.fade-in.zoom-in-95 {
          animation: none;
        }

        :where(button, a, [role="button"], [role="tab"], [role="menuitem"], .cursor-pointer, .product-card-shine, .hover-lift):active {
          transform: none;
        }
      }
      
      /* --- Utility Animations --- */
      
      /* Shine effect for cards */
      .product-card-shine {
        position: relative;
        overflow: hidden;
      }
      .product-card-shine::after {
        content: '';
        position: absolute;
        top: 0;
        left: -150%;
        width: 100%;
        height: 100%;
        background: linear-gradient(110deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 70%);
        transform: skewX(-25deg);
        transition: left 0.75s ease-in-out;
        pointer-events: none;
      }
      .product-card-shine:hover::after {
        left: 150%;
        transition: left 0.75s ease-in-out;
      }

      /* Simple scroll trigger for sections */
      .scroll-animate {
        opacity: 0;
        transform: translateY(40px);
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity, transform;
      }
      .scroll-animate.is-visible {
        opacity: 1 !important;
        transform: translateY(0) !important;
      }
      
      /* Staggered Animation Container */
      /* Parent element should have .stagger-animate-container */
      /* Children should have .animate-child */
      .stagger-animate-container .animate-child {
        opacity: 0;
        transform: translateY(30px);
        transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }
      
      /* When parent becomes visible, children animate in with delay */
      .stagger-animate-container.is-visible .animate-child {
        opacity: 1 !important;
        transform: translateY(0) !important;
      }
      
      /* Delays for up to 12 items */
      .stagger-animate-container.is-visible .animate-delay-1 { transition-delay: 0.05s; }
      .stagger-animate-container.is-visible .animate-delay-2 { transition-delay: 0.1s; }
      .stagger-animate-container.is-visible .animate-delay-3 { transition-delay: 0.15s; }
      .stagger-animate-container.is-visible .animate-delay-4 { transition-delay: 0.2s; }
      .stagger-animate-container.is-visible .animate-delay-5 { transition-delay: 0.25s; }
      .stagger-animate-container.is-visible .animate-delay-6 { transition-delay: 0.3s; }
      .stagger-animate-container.is-visible .animate-delay-7 { transition-delay: 0.35s; }
      .stagger-animate-container.is-visible .animate-delay-8 { transition-delay: 0.4s; }
      .stagger-animate-container.is-visible .animate-delay-9 { transition-delay: 0.45s; }
      .stagger-animate-container.is-visible .animate-delay-10 { transition-delay: 0.5s; }
      .stagger-animate-container.is-visible .animate-delay-11 { transition-delay: 0.55s; }
      .stagger-animate-container.is-visible .animate-delay-12 { transition-delay: 0.6s; }
      
      /* Failsafe: ensure opacity 1 if no JS or after animation */
      .no-js .scroll-animate, .no-js .animate-child {
          opacity: 1 !important;
          transform: none !important;
      }

      /* --- Interactive Hover Effects --- */
      .hover-lift {
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .hover-lift:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.15);
      }

      /* Cart Sidebar */
      .cart-overlay {
        position: fixed;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.6);
        z-index: 998;
        opacity: 0;
        transition: opacity 0.4s ease-in-out;
        pointer-events: none;
        backdrop-filter: blur(2px);
      }
      .cart-overlay.is-open {
        opacity: 1;
        pointer-events: auto;
      }
      .cart-sidebar {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        max-width: 400px;
        background: rgba(255, 255, 255, 0.8);
        border-left: 1px solid rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(40px);
        z-index: 999;
        transform: translateX(100%);
        transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: -25px 0 50px rgba(15, 23, 42, 0.16);
      }
      .cart-sidebar.is-open {
        transform: translateX(0);
      }

      /* Modal Basics */
      .common-modal-overlay {
        position: fixed;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.7);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(5px);
        opacity: 0;
        animation: fade-in 0.3s forwards;
      }
      .common-modal-content {
        background: white;
        border-radius: 1rem;
        box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        opacity: 0;
        transform: scale(0.95);
        animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      /* Special Utilities */
      .cart-toast {
        position: fixed;
        top: 5.5rem; /* Below header */
        right: 1.5rem;
        background-color: var(--color-primary);
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 9999px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        font-weight: 600;
        z-index: 1001;
        transform: translateY(-20px) scale(0.95);
        opacity: 0;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        pointer-events: none;
      }
      .cart-toast.is-visible {
        transform: translateY(0) scale(1);
        opacity: 1;
      }

      /* Coming Soon / Feature Modals */
      .coming-soon-overlay, .share-modal-overlay {
         @extend .common-modal-overlay;
         position: fixed;
         inset: 0;
         background-color: rgba(0, 0, 0, 0.75);
         z-index: 1000;
         display: flex;
         align-items: center;
         justify-content: center;
         backdrop-filter: blur(4px);
         animation: fade-in 0.3s ease-out forwards;
      }
      
      .coming-soon-content, .share-modal-content {
         @extend .common-modal-content;
         animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
      
      /* Feature Accordion */
      .feature-accordion-header {
        cursor: pointer;
        transition: background-color 0.2s ease-out;
      }
      .feature-accordion-header:hover {
        background-color: #f9fafb; /* gray-50 */
      }
      .feature-accordion-content {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), padding 0.3s ease;
      }
      .feature-accordion-content.is-open {
        max-height: 300px;
        padding-top: 0.5rem;
        padding-bottom: 1rem;
      }

      /* Floating Icon Animation */
      @keyframes icon-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      .animate-icon-float {
        animation: icon-float 3s ease-in-out infinite;
      }
      
      /* Price Flash */
      @keyframes price-flash-anim {
        0% { transform: scale(1); background-color: transparent; }
        30% { transform: scale(1.05); background-color: #dbeafe; }
        100% { transform: scale(1); background-color: transparent; }
