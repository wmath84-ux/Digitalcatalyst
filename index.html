<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.1, maximum-scale=1.1, minimum-scale=1.1, user-scalable=no, viewport-fit=cover" />
    <!-- Dark by default so it matches the boot splash; the app switches it to
         light as soon as a light screen renders (see src/utils/themeColor.ts). -->
    <meta name="theme-color" content="#05060f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="google-site-verification" content="6eLv1FI47zrzjUwJu35mWI1sMzzTeyn0Mwgn_dMBUJw" />
    <!-- Dynamic manifest: the branding admin page can swap the logo and this
         endpoint reflects it live (installed PWA icon + Add to Home screen).
         The static /manifest.webmanifest is kept as an offline fallback. -->
    <link rel="manifest" href="/api/manifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.svg" />
    <title>Eduvora | Digital Catalyst</title>
    <style>
      @keyframes eduvora-logo-in { 0% { opacity: 0; transform: scale(.82) translateY(8px); } 65% { opacity: 1; transform: scale(1.04) translateY(0); } 100% { opacity: 1; transform: scale(1); } }
      @keyframes eduvora-logo-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes eduvora-progress { 0% { transform: translateX(-105%) scaleX(.35); } 55% { transform: translateX(25%) scaleX(.75); } 100% { transform: translateX(210%) scaleX(.35); } }
      .app-boot-splash { min-height: 100dvh; display: grid; place-items: center; padding: 24px; color: #fff; background: radial-gradient(circle at 50% 35%, #312e81 0, #11132f 35%, #05060f 75%); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .app-boot-content { width: min(280px, 82vw); text-align: center; animation: eduvora-logo-in .55s cubic-bezier(.2,.8,.2,1) both; }
      .app-boot-icon { width: 88px; height: 88px; margin: 0 auto; display: block; filter: drop-shadow(0 16px 25px rgba(79,70,229,.38)); animation: eduvora-logo-float 1.8s ease-in-out .55s infinite; }
      .app-boot-title { margin: 18px 0 4px; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
      .app-boot-label { margin: 0; color: #a5b4fc; font-size: 12px; font-weight: 600; }
      .app-boot-track { height: 4px; margin-top: 24px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.12); }
      .app-boot-bar { width: 46%; height: 100%; border-radius: inherit; background: linear-gradient(90deg,#818cf8,#c084fc,#f0abfc); transform-origin: left; animation: eduvora-progress 1.35s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .app-boot-content,.app-boot-icon,.app-boot-bar { animation: none; } .app-boot-bar { width: 70%; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-boot-splash" role="status" aria-label="Loading Eduvora" style="display:none">
        <div class="app-boot-content">
          <img class="app-boot-icon" id="boot-brand-icon" src="/icons/icon-192x192.svg" alt="Eduvora" />
          <p class="app-boot-title">Eduvora</p>
          <p class="app-boot-label">Preparing your learning space…</p>
          <div class="app-boot-track"><div class="app-boot-bar"></div></div>
        </div>
      </div>
    </div>
    <!-- Apply cached branding to the boot splash + document title BEFORE the
         React bundle loads, so a renamed app never flashes "Eduvora" on reload.
         The live Firestore values overwrite this once BrandingProvider mounts.
         The cached default zoom (110%) is applied at the same time so there is
         no flash between the default and the admin-configured value. -->
    <script>
      (function () {
        try {
          var zoom = 110;
          try {
            var zoomRaw = localStorage.getItem("eduvora.appZoom.v1");
            if (zoomRaw) {
              var parsedZoom = Number(JSON.parse(zoomRaw).zoom);
              if (Number.isFinite(parsedZoom)) zoom = Math.min(200, Math.max(50, Math.round(parsedZoom)));
            }
          } catch (zoomErr) { /* private mode / corrupt cache — keep 110 */ }
          document.documentElement.dataset.appZoom = String(zoom);
          var scale = String(zoom / 100);
          var viewportMeta = document.querySelector('meta[name="viewport"]');
          if (viewportMeta) {
            viewportMeta.content = "width=device-width, initial-scale=" + scale +
              ", maximum-scale=" + scale + ", minimum-scale=" + scale +
              ", user-scalable=no, viewport-fit=cover";
          }
          var raw = localStorage.getItem("eduvora.branding.v2");
          var legacy = localStorage.getItem("eduvora.brandLogoUrl.v1");
          var data = raw ? JSON.parse(raw) : {};
          var name = (data.appName || "Eduvora").toString().trim().slice(0, 40);
          var tagline = (data.tagline || "Digital Catalyst").toString().trim().slice(0, 80);
          var logo = (data.logoUrl || legacy || "/icons/icon-192x192.svg").toString();
          var openingAnimationEnabled = data.openingAnimationEnabled === true;
          var hideFrameBorders = data.hideFrameBorders !== false;
          document.documentElement.dataset.hideFrameBorders = String(hideFrameBorders);
          if (!/^https?:\/\//.test(logo) && !logo.startsWith("/")) logo = "/icons/icon-192x192.svg";
          if (name) {
            var t = document.querySelector(".app-boot-title");
            if (t) t.textContent = name;
            document.title = tagline ? name + " | " + tagline : name;
          }
          var icon = document.getElementById("boot-brand-icon");
          if (icon) { icon.src = logo; if (name) icon.alt = name; }
          var splash = document.querySelector(".app-boot-splash");
          if (splash && name) splash.setAttribute("aria-label", "Loading " + name);
          if (splash && openingAnimationEnabled) splash.style.display = "";
        } catch (e) { /* private mode / corrupt cache — keep static defaults */ }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
