# Deploys firestore.rules / storage.rules / firestore.indexes.json to the live
# project on every push to `main` that touches them.
#
# WHY THIS EXISTS — "My Study Library keval admin account se chalta hai"
# ────────────────────────────────────────────────────────────────────────────
# firestore.rules ends with a catch-all:
#
#     match /{document=**} { allow read, write: if isAdmin(); }
#
# The developer's account (wmath84@gmail.com, role=admin) can therefore read and
# write EVERY path in the database. Any collection whose owner-scoped rule is
# missing from the DEPLOYED rules — because the rules file was edited in the repo
# but never pushed to the project — works perfectly for the admin and fails with
# `permission-denied` for every other learner. That single asymmetry is what
# makes a rules gap look like "this feature is admin-only".
#
# Notes (`users/{uid}/notes`) and entitlements are exactly that case: they are
# correct in this file's sibling `firestore.rules`, and useless until they are
# deployed. Hosting has had an automatic deploy since the beginning
# (firebase-hosting-deploy.yml); the rules did not, so the SPA and its security
# rules could drift apart on every release.
#
# The client now also has a server-side fallback for My Study Library
# (`/api/my-courses`, Admin SDK — see api/_lib/myCourses.ts), so the library
# works even while a rules deploy is pending. This workflow is what closes the
# gap permanently.
name: Deploy Firebase rules

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json
      - storage.rules
      - firebase.json
      - tests/sanctuaryFirestoreRules.emulator.mjs
      - utils/courseNotes.js
      - utils/deviceNotifications.js
      - utils/mindMapTree.js
      - package.json
      - package-lock.json
      - .github/workflows/firebase-rules-deploy.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci

      # Compile the complete rules and exercise real normal-user note/map
      # writes against a demo emulator BEFORE touching the live project.
      - name: Verify sanctuary Firestore rules
        run: npm run test:sanctuary:rules

      # FIREBASE_SERVICE_ACCOUNT alone is not understood by firebase-tools.
      # Use ADC, without logging the secret or keeping it in the checkout.
      - name: Authenticate Firebase CLI
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync, appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          const raw = process.env.FIREBASE_SERVICE_ACCOUNT;
          if (!raw) throw new Error('Configure the FIREBASE_SERVICE_ACCOUNT GitHub Actions secret before deploying rules.');
          const account = JSON.parse(raw);
          if (!account.client_email || !account.private_key) throw new Error('FIREBASE_SERVICE_ACCOUNT must be a valid service-account JSON object.');
          const path = join(process.env.RUNNER_TEMP, 'firebase-rules-service-account.json');
          writeFileSync(path, JSON.stringify(account), { mode: 0o600 });
          appendFileSync(process.env.GITHUB_ENV, `GOOGLE_APPLICATION_CREDENTIALS=${path}\n`);
          NODE

      # `firebase deploy` validates the rules file before uploading it, so a
      # syntax error fails the job loudly instead of silently leaving the old
      # rules in place.
      - name: Deploy Firestore + Storage rules
        run: >-
          npx --yes firebase-tools@13 deploy
          --only firestore:rules,firestore:indexes,storage:rules
          --project my-website-761e9
          --non-interactive

      - name: Report
        if: success()
        run: echo "firestore.rules / storage.rules are live on my-website-761e9."

      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-rules-service-account.json"
