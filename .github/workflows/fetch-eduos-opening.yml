# One-shot: download the exact EduOS opening animation from GitHub
# user-attachments (S3 is unreachable from the Arena sandbox) and commit
# it to this branch so the app can play the unmodified MP4.
name: Fetch EduOS opening animation

on:
  push:
    branches: [arena/01a06cef-digitalcatalyst]
    paths:
      - ".github/workflows/fetch-eduos-opening.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a06cef-digitalcatalyst
          fetch-depth: 1

      - name: Download the exact opening animation
        run: |
          set -euo pipefail
          mkdir -p public/assets/animations
          dest="public/assets/animations/EduOS_app_opening.mp4"
          curl -L --fail --retry 8 --retry-delay 2 --retry-all-errors \
            -A "Mozilla/5.0" \
            -o "$dest" \
            "https://github.com/user-attachments/assets/e82f3079-a4d9-47f2-a929-eeb2146c4aaf"
          ls -lh "$dest"
          file "$dest"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("public/assets/animations/EduOS_app_opening.mp4")
          data = p.read_bytes()
          assert len(data) > 10_000, f"file too small: {len(data)}"
          assert data[4:8] == b"ftyp", f"not an mp4 ftyp box: {data[:16]!r}"
          print(f"ok bytes={len(data)}")
          PY

      - name: Commit the video onto this branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/animations/EduOS_app_opening.mp4
          if git diff --cached --quiet; then
            echo "Video already present; nothing to commit."
            exit 0
          fi
          git commit -m "Add exact EduOS app opening animation (EduOS_app_opening.mp4)"
          git push origin arena/01a06cef-digitalcatalyst
