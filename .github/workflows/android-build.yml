name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Only the newest main build should publish the public APK. PR builds keep
# their own concurrency groups and never get permission to publish a release.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's DEFAULT packages are 'tools platform-tools'.
          # Google removed the deprecated 'tools' package from the SDK
          # repository, and the current sdkmanager (cmdline-tools 16.x)
          # exits 1 on the missing package, so the job dies in SDK setup
          # before any gradle work runs. Request exactly what this build
          # needs instead: platform 35 (compileSdkVersion 35 in
          # android/variables.gradle) + matching build-tools.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web app
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          else
            echo "WARNING: GOOGLE_SERVICES_JSON_BASE64 secret nahi mila!"
          fi

      # Fails the build if google-services.json has no Android OAuth client
      # (i.e. no SHA-1 registered) - otherwise the APK installs fine and only
      # throws ApiException: 10 the first time a learner taps "Continue with
      # Google". See docs/android-google-signin.md.
      - name: Verify Google Sign-In config
        run: npm run verify:google-signin

      - name: Capacitor sync android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  build-release:
    name: Build signed Release APK and AAB
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build-apk
    permissions:
      contents: write # gh release create/upload; PR jobs never run this job
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's DEFAULT packages are 'tools platform-tools'.
          # Google removed the deprecated 'tools' package from the SDK
          # repository, and the current sdkmanager (cmdline-tools 16.x)
          # exits 1 on the missing package, so the job dies in SDK setup
          # before any gradle work runs. Request exactly what this build
          # needs instead: platform 35 (compileSdkVersion 35 in
          # android/variables.gradle) + matching build-tools.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web app
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          else
            echo "WARNING: GOOGLE_SERVICES_JSON_BASE64 secret nahi mila!"
          fi

      # Fails the build if google-services.json has no Android OAuth client
      # (i.e. no SHA-1 registered) - otherwise the APK installs fine and only
      # throws ApiException: 10 the first time a learner taps "Continue with
      # Google". See docs/android-google-signin.md.
      - name: Verify Google Sign-In config
        run: npm run verify:google-signin

      - name: Capacitor sync android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          else
            echo "Warning: KEYSTORE_BASE64 secret nahi mila!"
          fi

      - name: Build signed Release APK and AAB
        run: |
          test -s android/app/release.jks || { echo 'Release keystore missing'; exit 1; }
          cd android && ./gradlew bundleRelease assembleRelease --no-daemon \
            -PEDUVORA_KEYSTORE_FILE=${{ github.workspace }}/android/app/release.jks \
            -PEDUVORA_KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} \
            -PEDUVORA_KEYSTORE_ALIAS=${{ secrets.KEY_ALIAS }} \
            -PEDUVORA_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}

      - name: Verify APK is signed
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # Actions artifacts are ZIPs behind a GitHub login and expire. A public
      # Release asset is a real APK with a stable, unauthenticated download URL.
      # Never publish from PRs; only successful signed main builds reach here.
      - name: Publish latest APK for the landing page
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          title="Android APK (build #${GITHUB_RUN_NUMBER})"
          notes="Signed Android APK from main, build #${GITHUB_RUN_NUMBER} (${GITHUB_SHA})."
          if gh release view android-apk >/dev/null 2>&1; then
            gh release upload android-apk "$apk" --clobber
            gh release edit android-apk --title "$title" --notes "$notes"
          else
            gh release create android-apk "$apk" --target "$GITHUB_SHA" \
              --title "$title" --notes "$notes" --latest=false
          fi
