# Minute-level pinger for the real-time push scheduler.
#
# Why this exists: every notification (My Day reminders, renewals, unlocks,
# FlowPath jobs, product/content announcements) is delivered by the server
# scheduler, so it has to be pinged every minute — whether or not the app is
# open. Vercel's Hobby plan caps cron at ONE run per day, so an external
# timer must drive it.
#
# ── Why each run LOOPS for ~5 hours instead of pinging once ─────────────────
# GitHub's `schedule` trigger is best-effort, not real-time. On this
# repository the minute cron actually delivered start events 1h20m–5h20m
# apart (and frequently dropped them entirely). A run that pings once (or
# the old 21-minute loop) therefore left multi-hour holes: a reminder in the
# hole arrived late, or — past the 2h catch-up cap — never. The
# user-visible symptom was "notifications only arrive when I open the app".
#
# The fix has two layers:
#   1. Every scheduled start runs a ~5-hour loop (one ping every 60s). GitHub
#      caps a job at 6h, so 300 ticks + timeout 330 fit. Even with schedule
#      starts 5+ hours apart, the active loop is still pinging when the next
#      start queues; the queued loop starts the instant this one ends,
#      yielding near-continuous coverage.
#   2. push-scheduler-backup.yml runs the IDENTICAL loop on its own minute
#      cron, doubling the odds of a timely start. Both share this
#      concurrency group, so only one loop ever runs.
# The loop itself lives in .github/actions/ping-loop/action.yml — keep all
# logic there so the two workflows cannot drift.
#
# This repository is public, so GitHub-hosted runner minutes are free.
# NOTE: GitHub disables scheduled workflows after ~60 days without
# repository activity — any commit to the default branch re-enables them.
#
# Setup (one time):
#   1. Repo → Settings → Secrets and variables → Actions
#   2. Add secret  CRON_SECRET     — same value as the Vercel env var
#   3. Add secret  SCHEDULER_URL   — https://<your-domain>/api/cron/subscription-renewals
#
# The daily Vercel cron stays as a safety net: if this workflow is disabled
# or GitHub has an outage, the catch-up window (resolveLookbackMs in
# utils/pushScheduler.js, capped at 2h, override with MYDAY_MAX_CATCHUP_HOURS)
# still sweeps up anything recently missed. See docs/PUSH_SCHEDULER.md.

name: Push scheduler

on:
  schedule:
    # Every minute. GitHub throttles/drops this heavily (see above) — the
    # 5-hour loop compensates. Runs are idempotent and cheap, and the
    # endpoint deduplicates per item per local day, so overlapping pings
    # are safe.
    - cron: "* * * * *"
  # Lets you fire a run by hand from the Actions tab when testing.
  workflow_dispatch:

# One loop at a time, shared with push-scheduler-backup.yml.
# cancel-in-progress: false means a fresh scheduled run queues behind the
# active loop instead of killing it, so coverage stays continuous:
# active loop ends → queued loop starts immediately.
concurrency:
  group: push-scheduler
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    # 300 one-minute ticks, plus headroom for slow curls (max 55s each).
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Run scheduler ping loop
        uses: ./.github/actions/ping-loop
        with:
          loop-minutes: 300
