# Minute-level pinger for the real-time push scheduler.
#
# ⚠️  THIS FILE IS THE TEMPLATE; the live workflow is
#     .github/workflows/push-scheduler.yml (already committed). Keep the two
#     in sync if you change one.
#
# Why this exists: My Day reminders have to fire at the exact minute the
# user chose, whether or not the app is open. That needs something calling
# the scheduler every minute — and Vercel's Hobby plan caps cron at ONE run
# per day (a sub-daily expression in vercel.json fails at deploy time), with
# even that run landing anywhere inside its hour.
#
# The scheduler endpoint is an ordinary authenticated HTTP route, so any
# external timer can drive it. GitHub Actions is free for this and lives in
# the repo, so there is no third-party account to lose.
#
# The daily Vercel cron stays as a safety net: if this workflow is disabled
# or GitHub has an outage, the catch-up window still sweeps up anything
# missed (see resolveLookbackMs in utils/pushScheduler.js).
#
# Setup (one time):
#   1. Repo → Settings → Secrets and variables → Actions
#   2. Add secret  CRON_SECRET     — same value as the Vercel env var
#   3. Add secret  SCHEDULER_URL   — https://<your-domain>/api/cron/subscription-renewals
#
# GitHub's scheduler is best-effort, not hard real-time — under load a run
# can land a minute late. That is fine here: the endpoint derives its own
# catch-up window from the last successful run, so a late ping still
# delivers every reminder that came due in between (capped at 1h so a
# 9 AM reminder never fires at 6 PM).

name: Push scheduler

on:
  schedule:
    # Every minute. Runs are idempotent and cheap, and the endpoint
    # deduplicates per item per local day, so an occasional double-fire
    # never produces two notifications.
    - cron: "* * * * *"
  # Lets you fire a run by hand from the Actions tab when testing.
  workflow_dispatch:

# A slow run must never overlap with the next tick. cancel-in-progress:
# false means a long run queues rather than being killed, so no minute is
# silently skipped.
concurrency:
  group: push-scheduler
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Trigger scheduled push jobs
        env:
          SCHEDULER_URL: ${{ secrets.SCHEDULER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SCHEDULER_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::SCHEDULER_URL and CRON_SECRET repository secrets are required."
            exit 1
          fi
          # Capture the body once. Without this, --retry re-prints the same
          # 500 body on every attempt, which is what produced three copies of
          # {"ok":false,...} in the original failing logs.
          body_file="$(mktemp)"
          http_code=0
          for attempt in 1 2 3; do
            set +e
            http_code="$(curl --silent --show-error \
              --max-time 120 \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              --output "${body_file}" \
              --write-out '%{http_code}' \
              "${SCHEDULER_URL}")"
            curl_status=$?
            set -e
            if [ "${curl_status}" -eq 0 ] && [ "${http_code}" -ge 200 ] && [ "${http_code}" -lt 300 ]; then
              echo "Scheduler responded HTTP ${http_code}:"
              cat "${body_file}"
              echo ""
              rm -f "${body_file}"
              exit 0
            fi
            echo "::warning::Attempt ${attempt} failed (curl exit ${curl_status}, HTTP ${http_code})."
            if [ "${attempt}" -lt 3 ]; then sleep 5; fi
          done
          echo "::error::Scheduler did not return 2xx after 3 attempts. Last response (HTTP ${http_code}):"
          cat "${body_file}"
          echo ""
          rm -f "${body_file}"
          exit 1
