# .github/workflows/firebase-hosting-deploy.yml
name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22, not 20: several dev dependencies the install pulls in
          # (jsdom 30, undici 8, whatwg-url 17, @asamuzakjp/*) declare
          # `engines.node` of ^22.x or newer, so Node 20 made every `npm ci`
          # print a wall of EBADENGINE warnings. Nothing in the tree excludes
          # 22 (checked against every `engines` field in package-lock.json),
          # Vite 7 wants ^20.19 || >=22.12, and firebase-rules-deploy.yml has
          # been building on 22 already.
          node-version: 22
      - run: npm ci
      - run: npm run build

      # ── Firebase Hosting Oct 15 2026 change ────────────────────────────────
      # Starting Oct 15 2026, new Firebase projects no longer auto-create a
      # default Hosting site. Existing project my-website-761e9 already has its
      # site, so deploy would still succeed today. This explicit step makes the
      # workflow future-proof (new projects, site deleted, or 404 Site Not Found
      # in CI) per Firebase email: Option 1 recommended for CI/CD.
      # https://firebase.google.com/docs/hosting/multisites#set_up_deploy_targets
      - name: Ensure Hosting site exists (on-demand provisioning fix)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "Checking/creating Hosting site my-website-761e9 for project my-website-761e9..."
          npx --yes firebase-tools@13 hosting:sites:create my-website-761e9 --project my-website-761e9 || echo "Site already exists or creation not needed, continuing."

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: my-website-761e9
          channelId: live
