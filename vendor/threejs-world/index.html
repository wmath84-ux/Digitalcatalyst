<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>threejs-world</title>
    <link rel="stylesheet" href="./src/desktop.css" />
  </head>
  <body>
    <div id="app"></div>
    <nav id="world-navigation" aria-label="Game navigation">
      <a id="world-back" href="../#/home">← Back to app</a>
      <button type="button" id="world-retry">Restart world</button>
    </nav>
    <div id="boot" role="status" aria-live="polite">
      <div class="title">threejs-world</div>
      <div id="boot-msg">Loading game files…</div>
      <div class="bar"><div id="boot-bar"></div></div>
      <p id="world-loading-note">Preparing the full world. First load can take some time.</p>
    </div>
    <noscript>JavaScript is required to open this world. Use Back to app to return.</noscript>
    <!-- These controls work even if the engine bundle fails to download/parse. -->
    <script>
      (function () {
        var back = document.getElementById('world-back');
        try {
          var saved = sessionStorage.getItem('dc:game:return-to');
          if (saved) {
            var target = new URL(saved, location.origin);
            if (target.origin === location.origin && target.pathname.indexOf('/game-world/') === -1) back.href = target.href;
          }
        } catch (_) {}
        document.getElementById('world-retry').addEventListener('click', function () { location.reload(); });
        window.addEventListener('error', function (event) {
          if (event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK')) {
            document.getElementById('boot-msg').textContent = 'Game files could not load. Check your connection, then restart.';
          }
        }, true);
        setTimeout(function () {
          if (!window.__laas || (!window.__laas.ready && !window.__laas.error)) {
            document.getElementById('world-loading-note').textContent = 'World generation is taking longer on this device. You can wait, restart, or return to the app.';
          }
        }, 60000);
      }());
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
